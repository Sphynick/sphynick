<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nick Njau | Web Developer</title>
  <meta name="description" content="Nick Njau - IT specialist and web developer in Nairobi. Clean, fast websites and AI tools." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230e0f12'/%3E%3Cpath fill='%23ffb454' d='M1 1h1v6H1zM2 2h1v1H2zM3 3h1v2H3zM4 4h1v1H4zM5 1h1v6H5z'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            retro: ['VT323', 'monospace'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            ink: '#0e0f12',
            panel: '#16181d',
            line: '#2a2d35',
            paper: '#e8e6df',
            mute: '#8a8d96',
            amber: '#ffb454',
            mint: '#7ee0a8',
          },
        },
      },
    };
  </script>
  <style>
    :root { --px: 4px; }
    html { background: #0e0f12; }
    body {
      background: #0e0f12;
      color: #e8e6df;
      font-family: 'JetBrains Mono', monospace;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    img, svg.pixel { image-rendering: pixelated; }
    ::selection { background: #ffb454; color: #0e0f12; }

    /* subtle scanlines + dither grid */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: overlay;
    }
    .grid-bg {
      background-image:
        linear-gradient(#1a1c22 1px, transparent 1px),
        linear-gradient(90deg, #1a1c22 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* pixel border: stepped corners, no radius */
    .px-box {
      position: relative;
      background: #16181d;
      box-shadow:
        0 calc(var(--px) * -1) 0 0 #2a2d35,
        0 var(--px) 0 0 #2a2d35,
        calc(var(--px) * -1) 0 0 0 #2a2d35,
        var(--px) 0 0 0 #2a2d35;
    }
    .px-box-amber {
      box-shadow:
        0 calc(var(--px) * -1) 0 0 #ffb454,
        0 var(--px) 0 0 #ffb454,
        calc(var(--px) * -1) 0 0 0 #ffb454,
        var(--px) 0 0 0 #ffb454;
    }
    .px-hover { transition: transform .12s steps(2), box-shadow .12s steps(2); }
    .px-hover:hover { transform: translate(-2px, -2px); }

    /* chunky button with hard drop shadow that presses in */
    .px-btn {
      display: inline-flex; align-items: center; gap: .75rem;
      font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: .02em;
      padding: 14px 18px; background: #ffb454; color: #0e0f12;
      box-shadow: 4px 4px 0 0 #7a4a10;
      transition: transform .08s steps(1), box-shadow .08s steps(1);
      text-transform: uppercase;
    }
    .px-btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 #7a4a10; }
    .px-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 0 #7a4a10; }
    .px-btn-ghost { background: transparent; color: #e8e6df; box-shadow: inset 0 0 0 2px #2a2d35, 4px 4px 0 0 #2a2d35; }
    .px-btn-ghost:hover { box-shadow: inset 0 0 0 2px #ffb454, 2px 2px 0 0 #2a2d35; color: #ffb454; }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bob { animation: bob 1.2s steps(2) infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    /* hp-style bar */
    .bar { height: 12px; background: #0e0f12; box-shadow: inset 0 0 0 2px #2a2d35; }
    .bar > i { display: block; height: 100%; background: repeating-linear-gradient(90deg, #ffb454 0 8px, #e39a3c 8px 10px); }

    ::-webkit-scrollbar { width: 12px; background: #0e0f12; }
    ::-webkit-scrollbar-thumb { background: #2a2d35; border: 2px solid #0e0f12; }
    @media (prefers-reduced-motion: reduce) { .blink, .bob { animation: none; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
